[project]
name = "vantix-quant"
version = "0.0.1"
description = "Vantix Quant/AI servisi — TEFAS skorlama, HRP+CVaR, Portfolio Doctor. Karar deterministik; LLM yalnız açıklama."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Servis çalıştırma (NATS worker + HTTP). Çekirdek matematik bunlarsız da test edilir.
service = ["fastapi>=0.110", "uvicorn>=0.29", "nats-py>=2.6"]
# İleri optimizasyon (mean-CVaR solver) ve LLM açıklama — v1.
solver = ["cvxpy>=1.4", "riskfolio-lib>=6.0"]
llm = ["langgraph>=0.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantix_quant"]
