services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_USER: vantix, POSTGRES_PASSWORD: vantix, POSTGRES_DB: vantix }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
volumes: { pgdata: {} }
